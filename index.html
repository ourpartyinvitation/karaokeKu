<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaraokeKu - Web Karaoke Player</title>
    
    <!-- Favicon Vektor Kustom (Warna Indigo) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'%3E%3Cpath d='M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z'/%3E%3C/svg%3E">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dragging { opacity: 0.5; border: 2px dashed #6366f1; }
        .playlist-item { cursor: grab; }
        .playlist-item:active { cursor: grabbing; }
        #centerPanel:fullscreen {
            background-color: #000 !important;
            padding: 0 !important;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col lg:flex-row lg:h-screen lg:overflow-hidden">

    <!-- ================= PANEL KIRI ================= -->
    <div id="leftPanel" class="order-2 lg:order-1 w-full lg:w-1/4 bg-gray-800 flex flex-col border-b lg:border-b-0 lg:border-r border-gray-700 h-[50vh] lg:h-auto">
        <div class="p-4 border-b border-gray-700 shrink-0">
            <h1 class="text-xl lg:text-2xl font-bold text-indigo-400 mb-3 lg:mb-4">🎤 KaraokeKu</h1>
            
            <div class="flex gap-2 mb-3 lg:mb-4">
                <button id="btnLocal" class="flex-1 bg-indigo-600 hover:bg-indigo-500 transition-colors py-1.5 lg:py-1 rounded text-sm font-semibold shadow-md" onclick="switchSource('local')">Lokal</button>
                <button id="btnYT" class="flex-1 bg-gray-700 hover:bg-gray-600 transition-colors py-1.5 lg:py-1 rounded text-sm font-semibold shadow-md" onclick="switchSource('youtube')">YouTube</button>
            </div>

            <!-- Tab Lokal -->
            <div id="localInputContainer" class="flex flex-col gap-2 mb-2">
                <input type="file" id="folderInput" webkitdirectory directory multiple accept="video/*,audio/*" class="hidden">
                <button onclick="document.getElementById('folderInput').click()" class="w-full bg-green-600 hover:bg-green-500 transition-colors shadow-md py-2 rounded text-sm font-bold">
                    📁 Pilih Folder Komputer
                </button>
                <input type="text" id="searchInput" placeholder="Cari Judul / Penyanyi..." class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 transition-colors mt-1">
            </div>
            
            <!-- Tab YouTube -->
            <div id="ytInputContainer" class="hidden flex-col gap-2 mb-2">
                <input type="text" id="ytTitleInput" placeholder="Contoh: Dewa 19 - Kangen" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none transition-colors">
                <input type="text" id="ytLinkInput" placeholder="Paste Link URL YouTube..." class="w-full bg-gray-900 border border-red-600 rounded px-3 py-2 text-sm focus:outline-none transition-colors">
                <button onclick="saveAndAddYoutube()" class="w-full bg-red-600 hover:bg-red-500 transition-colors shadow-md py-2 rounded text-sm font-bold">Simpan & Tambah ke Playlist</button>
                
                <!-- FITUR BARU: Input Pencarian Riwayat YouTube -->
                <input type="text" id="searchYtInput" placeholder="Cari Riwayat Judul / Link..." class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-red-500 transition-colors mt-1">
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-2" id="songList">
            <div class="text-center text-gray-500 text-sm mt-10">Klik "Pilih Folder" untuk memuat lagu lokal Anda.</div>
        </div>

        <div id="ytSavedList" class="hidden flex-1 flex-col overflow-y-auto p-2 border-t border-gray-700 bg-gray-850">
            <div class="text-xs text-gray-400 font-bold mb-3 mt-1 px-1">📋 Riwayat Link Tersimpan:</div>
            <div id="ytListContainer" class="flex flex-col gap-2"></div>
        </div>
    </div>

    <!-- ================= PANEL TENGAH (VIDEO) ================= -->
    <div id="centerPanel" class="order-1 lg:order-2 w-full lg:w-2/4 flex flex-col bg-gray-950 relative h-[35vh] min-h-[250px] lg:h-auto lg:min-h-0">
        <div class="absolute top-0 left-0 w-full p-1.5 lg:p-2 bg-black bg-opacity-60 z-10 text-center">
            <h2 id="nowPlayingTitle" class="font-bold text-sm lg:text-lg text-indigo-300 drop-shadow-md transition-all truncate px-2">Belum ada lagu diputar</h2>
        </div>

        <div class="flex-1 p-2 lg:p-4 flex flex-col justify-center relative mt-8 lg:mt-10">
            <video id="localPlayer" class="w-full h-full max-h-full object-contain bg-black rounded lg:shadow-2xl transition-opacity" crossorigin="anonymous" controlsList="nodownload"></video>
            
            <div id="ytWrapper" class="hidden w-full h-full max-h-full bg-black rounded lg:shadow-2xl overflow-hidden relative">
                <div id="ytPlayerContainer"></div>
                <!-- Layer transparan yg membiarkan bagian bawah terbuka agar bisa klik Next iklan -->
                <div class="absolute top-0 left-0 right-0 bottom-8 bg-transparent z-50"></div>
            </div>
        </div>

        <div class="bg-gray-800 p-3 lg:p-4 border-t border-gray-700 shrink-0">
            <div class="flex flex-wrap items-center justify-center gap-2 lg:gap-3">
                <button onclick="toggleFullScreen()" class="bg-blue-600 hover:bg-blue-500 hover:scale-105 transition-all px-3 py-1.5 lg:px-4 lg:py-2 rounded font-bold text-xs lg:text-sm">🔲 Penuh</button>
                <button onclick="togglePlay()" class="bg-indigo-600 hover:bg-indigo-500 hover:scale-105 transition-all px-4 py-1.5 lg:px-6 lg:py-2 rounded-full font-bold text-xs lg:text-sm">⏯ Jeda/Main</button>
                <button onclick="nextSong()" class="bg-gray-600 hover:bg-gray-500 hover:scale-105 transition-all px-3 py-1.5 lg:px-4 lg:py-2 rounded-full font-bold text-xs lg:text-sm">⏭ Next</button>
                
                <select id="vocalMode" class="bg-gray-900 border border-gray-600 rounded px-2 py-1.5 lg:px-3 lg:py-2 text-xs lg:text-sm outline-none transition-colors max-w-[140px] lg:max-w-none" onchange="changeVocalMode()">
                    <option value="stereo">Vokal: Normal (Stereo)</option>
                    <option value="remove_center">Vokal: Hapus Penuh (Mode MP3/MP4 Biasa)</option>
                    <option value="left">Vokal: Matikan (Mode Karaoke - Kiri)</option>
                    <option value="right">Vokal: Matikan (Mode Karaoke - Kanan)</option>
                </select>

                <div class="flex items-center gap-1 lg:gap-2">
                    <span class="text-xs">🔈</span>
                    <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="1" oninput="changeVolume()" class="w-16 lg:w-20 cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <!-- ================= PANEL KANAN (EQ & Playlist) ================= -->
    <div id="rightPanel" class="order-3 w-full lg:w-1/4 bg-gray-800 flex flex-col border-t lg:border-t-0 lg:border-l border-gray-700 h-[50vh] lg:h-auto">
        <div class="p-3 lg:p-4 border-b border-gray-700 bg-gray-850 shrink-0">
            <h3 class="font-bold text-xs lg:text-sm text-gray-300 mb-2 lg:mb-3">🎛 Pengaturan Audio (Lokal)</h3>
            <div class="flex flex-col gap-2 lg:gap-3">
                <div class="flex items-center justify-between">
                    <label class="text-xs w-16">Bass</label>
                    <input type="range" id="eqBass" min="-15" max="15" value="0" class="flex-1 cursor-pointer" oninput="updateEQ()">
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-xs w-16">Drum(Mid)</label>
                    <input type="range" id="eqMid" min="-15" max="15" value="0" class="flex-1 cursor-pointer" oninput="updateEQ()">
                </div>
                <div class="flex items-center justify-between">
                    <label class="text-xs w-16">Voice Enh.</label>
                    <input type="range" id="eqTreble" min="-15" max="15" value="0" class="flex-1 cursor-pointer" oninput="updateEQ()">
                </div>
            </div>
        </div>

        <div class="p-3 lg:p-4 border-b border-gray-700 shrink-0">
            <h3 class="font-bold text-sm lg:text-base text-indigo-400">📋 Daftar Playlist</h3>
            <p class="text-[10px] lg:text-xs text-gray-400 mt-1">Lagu terhapus otomatis jika selesai dinyanyikan.</p>
        </div>
        
        <div class="flex-1 overflow-y-auto p-2" id="playlistContainer">
            <div class="text-center text-gray-500 text-sm mt-5">Playlist kosong.</div>
        </div>
    </div>

    <!-- ================= MODAL KUSTOM ================= -->
    <div id="customAlert" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[100] hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-5 lg:p-6 w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-300" id="customAlertBox">
            <h3 class="text-lg lg:text-xl font-bold text-red-500 mb-2">Peringatan</h3>
            <p id="customAlertMsg" class="text-xs lg:text-sm text-gray-300 mb-5"></p>
            <button onclick="closeAlert()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded font-bold transition-colors">OK</button>
        </div>
    </div>

    <div id="customConfirm" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[100] hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-5 lg:p-6 w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-300" id="customConfirmBox">
            <h3 class="text-lg lg:text-xl font-bold text-yellow-500 mb-2">Konfirmasi</h3>
            <p id="customConfirmMsg" class="text-xs lg:text-sm text-gray-300 mb-5"></p>
            <div class="flex gap-3">
                <button id="btnConfirmCancel" class="flex-1 bg-gray-600 hover:bg-gray-500 text-white py-2 rounded font-bold text-sm lg:text-base transition-colors shadow-md">Batal</button>
                <button id="btnConfirmOk" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2 rounded font-bold text-sm lg:text-base transition-colors shadow-md">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="javascript.js"></script>
</body>
</html>
